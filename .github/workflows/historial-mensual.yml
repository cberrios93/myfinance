name: Historial Mensual

on:
  # Corre cada hora en los días candidatos.
  # El script filtra por usuario según su día y hora configurados (zona Lima, UTC-5).
  # Días cubiertos: 1, 5, 10, 15, 20, 25, 28, 29, 30, 31 (los últimos 4 cubren "último día del mes")
  schedule:
    - cron: '0 * 1,5,10,15,20,25,28,29,30,31 * *'
  # Trigger manual para pruebas
  workflow_dispatch:

jobs:
  crear-historial:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Crear registro de historial
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/crear-historial.mjs
