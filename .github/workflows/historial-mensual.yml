name: Historial Mensual

on:
  # Día 1 de cada mes a las 8:00 UTC (3:00am Lima)
  schedule:
    - cron: '0 8 1 * *'
  # Trigger manual para pruebas
  workflow_dispatch:

jobs:
  crear-historial:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Crear registro de historial
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: node scripts/crear-historial.mjs
